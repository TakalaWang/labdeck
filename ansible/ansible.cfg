[defaults]
# forks=3: sshd MaxStartups drops extra parallel connections (kex_exchange_identification reset)
forks = 3
gathering = explicit
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False

[connection]
pipelining = True
# Public-facing sshd often sheds new connections (MaxStartups under internet scanning), dropping them before
# the banner. Retry those (SSH exit 255). Kept low: a rejected key is also exit 255, and repeated failed logins
# from outside the campus get the source IP banned by the campus IDS.
retries = 2
