[package]
name = "labdeck-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false
description = "LabDeck host-side collectors: node_exporter textfile metrics and the collect facts JSON"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
